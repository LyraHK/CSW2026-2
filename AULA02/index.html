    <h2>Vila Velha</h2>

    <h3>IMAGEM COMUM</h3>

    <img src="Praia da Costa-Vila Velha-ES.jpg" alt="Praia da Costa - Vila Velha">

<figure>                                                            
    <img src="Vila Velha.jpg" alt="Convento da Penha">

    </figure>

    <h3>IMAGEM COM ALTERAÇÃO DE TAMANHO</h3>

    <picture>
        <source media="(max-width:767px )" srcset="farol foto pequena.jpg">
        <source media="(min-width:768px )" srcset="farol foto grande.jpg">
        <img src="farol foto grande.jpg" alt="farol - vila velha" width="100%">
    </picture>
